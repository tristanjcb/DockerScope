name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels: [enhancement, "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the use case and who benefits.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and alternatives
    validations:
      required: true
  - type: checkboxes
    id: agreement
    attributes:
      label: Community agreement
      options:
        - label: I searched existing issues and agree to the code of conduct.
          required: true
