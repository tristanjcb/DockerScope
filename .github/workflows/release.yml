name: Release
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  HUSKY: "0"
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  package:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release tag and source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json", "utf8")).version; if (!/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$/.test(process.env.RELEASE_TAG) || process.env.RELEASE_TAG !== `v${version}`) process.exit(1);'
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm build
      - name: Create source and compiled archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release
          git archive --format=tar.gz --prefix="dockerscope-${RELEASE_TAG}/" -o release/source.tar.gz HEAD
          tar -czf release/compiled-apps.tar.gz apps/*/dist
          cd release
          sha256sum source.tar.gz compiled-apps.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --draft --title "DockerScope $RELEASE_TAG"
