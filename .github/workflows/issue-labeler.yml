name: Label issues
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: labelIssue } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/label-issue.mjs`);
            await labelIssue({ github, context });
